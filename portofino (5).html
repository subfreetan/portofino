<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Portofino — Pizzeria au feu de bois</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===== TOKENS ===== (source de vérité du thème — voir aussi CONFIG dans le JS) */
    :root {
      --bg: #100e0c;
      --bg-deep: #0b0908;
      --panel: #0d0b09;
      --surface: #181513;
      --surface-2: #1c1815;
      --surface-3: #171310;

      --ink: #f5ead8;
      --ink-dim: rgba(245, 234, 216, .5);
      --ink-faint: rgba(245, 234, 216, .4);
      --ink-mute: rgba(245, 234, 216, .3);

      --gold: #d8b06a;
      --gold-08: rgba(216, 176, 106, .08);
      --gold-12: rgba(216, 176, 106, .12);
      --gold-14: rgba(216, 176, 106, .14);
      --gold-22: rgba(216, 176, 106, .22);
      --gold-35: rgba(216, 176, 106, .35);
      --gold-42: rgba(216, 176, 106, .42);
      --gold-60: rgba(216, 176, 106, .6);

      --cta: #d67f48;          /* terracotta — actions */
      --olive: #8fa073;        /* vert secondaire */

      --line: rgba(245, 234, 216, .08);
      --line-2: rgba(245, 234, 216, .07);
      --line-soft: rgba(245, 234, 216, .06);

      --font-head: 'Caprasimo', Georgia, serif;
      --font-body: 'Figtree', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    body {
      background: var(--bg-deep);
      font-family: var(--font-body);
      color: var(--ink);
      display: flex;
      justify-content: center;
    }

    /* App plein écran — mobile only : hauteur fixe, défilement interne, onglets en bas */
    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;      /* fallback */
      height: 100dvh;     /* suit la barre d'URL mobile */
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* La zone de contenu défile, la barre d'onglets reste fixe dessous */
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .screen::-webkit-scrollbar { display: none; }
    /* Les blocs ne se compressent pas : l'écran défile au lieu d'écraser les encarts (sinon overflow:hidden les rogne à zéro) */
    .screen > * { flex-shrink: 0; }

    a { color: var(--gold); text-decoration: none; }
    button { font-family: var(--font-body); cursor: pointer; }
    img { display: block; max-width: 100%; }

    h1, h2, h3 { font-family: var(--font-head); font-weight: 400; line-height: 1.08; }

    /* ---- primitives réutilisables ---- */
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
    .eyebrow-gold { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .h-display { font-family: var(--font-head); font-size: 30px; line-height: 1.05; }

    .pill {
      flex: none; border-radius: 999px; font-size: 12.5px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
      font-family: var(--font-body); transition: .15s;
    }
    .pill.on { background: var(--gold-14); border-color: var(--gold-60); color: var(--gold); }

    .cta {
      border: none; border-radius: 999px; background: var(--cta); color: #1a1208;
      font-family: var(--font-head); font-size: 15.5px; cursor: pointer; transition: filter .15s, transform .1s;
    }
    .cta:hover { filter: brightness(1.08); }
    .cta:active { transform: scale(.985); }

    .ghost {
      border: 1px solid var(--gold-42); border-radius: 999px; background: transparent;
      color: var(--gold); font-family: var(--font-head); cursor: pointer; transition: background .15s;
    }
    .ghost:hover { background: var(--gold-12); }

    .slot-img {
      width: 100%; height: 100%;
      background: repeating-linear-gradient(45deg, #221d18, #221d18 12px, #1e1a15 12px, #1e1a15 24px);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-mute); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    }

    .card { border-radius: 22px; background: var(--surface); border: 1px solid var(--line-2); }

    /* ---- formulaires (auth) ---- */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--ink-dim); }
    .input {
      width: 100%; height: 52px; padding: 0 16px; font-family: var(--font-body); font-size: 15px;
      color: var(--ink); background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; caret-color: var(--gold); outline: none; transition: border-color .15s, background .15s;
    }
    .input::placeholder { color: var(--ink-mute); }
    .input:focus { border-color: var(--gold-60); background: var(--surface-2); }
    .input-wrap { position: relative; }
    .input-wrap .eye {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border: none; background: none; color: var(--ink-faint);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .auth-error {
      display: none; font-size: 12.5px; color: #e07a5a; background: rgba(224,122,90,.1);
      border: 1px solid rgba(224,122,90,.3); border-radius: 12px; padding: 10px 13px; line-height: 1.4;
    }
    .link-btn { border: none; background: none; color: var(--gold); font-size: 13.5px; cursor: pointer; font-family: var(--font-body); }

    /* ---- animations ---- */
    @keyframes pf-fly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(90px,340px) scale(.25); opacity: 0; } }
    @keyframes pf-pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
    @keyframes pf-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .rise { animation: pf-rise .5s ease both; }

    .fly-dot {
      position: absolute; left: 50%; bottom: 92px; width: 48px; height: 48px; border-radius: 999px;
      background: var(--gold); opacity: .9; z-index: 90; pointer-events: none;
      animation: pf-fly .72s cubic-bezier(.4,0,.7,1) forwards;
    }

    /* ---- tab bar ---- */
    .tabs {
      flex: none; z-index: 70; display: flex; align-items: stretch;
      padding: 6px 12px calc(14px + env(safe-area-inset-bottom, 0px));
      background: rgba(16,14,12,.86); backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
    }
    .tab {
      flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center;
      gap: 5px; padding: 6px 0; font-size: 10.5px; color: var(--ink-faint);
    }
    .tab.on { color: var(--gold); }
    .tab-center { flex: 1; background: none; border: none; display: flex; align-items: stretch; justify-content: center; padding: 0; }
    .tab-center span.knob {
      width: 70px; margin: -20px 0 -14px; padding: 11px 6px 9px; box-sizing: border-box;
      border-radius: 18px 18px 0 0; background: var(--ink); box-shadow: 0 8px 20px rgba(0,0,0,.5);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .badge {
      position: absolute; top: -6px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px;
      box-sizing: border-box; border-radius: 999px; background: var(--cta); color: #1a1208;
      font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
  /* ══════════════════════════════════════════════════════════════
     CONFIG — tout ce qui change d'un resto à l'autre est ici.
     ══════════════════════════════════════════════════════════════ */
  const CONFIG = {
    name: 'Portofino',
    tagline: 'Pizzeria au feu de bois',
    address: '14 rue des Arcades · four à bois, 90 secondes de cuisson',
    memberName: 'Lucie M.',

  const GOLD = CONFIG.colors.gold;

  /* ══════════════════════════════════════════════════════════════
     DONNÉES (en dur pour l'instant — viendront du backend ensuite)
     ══════════════════════════════════════════════════════════════ */
  const CATS = ['Pizzas', 'Pizzas blanches', 'Plats', 'Pâtes', 'Pâtes gratinées', 'Entrées chaudes', 'Desserts', 'Boissons'];

  const MENU = [

    { id: 'bolognaise', cat: 'Pâtes', name: 'Tagliatelles bolognaise', desc: 'Sauce longuement mijotée', price: 12 },

    { id: 'pesto', cat: 'Pâtes', name: 'Pesto genovese', desc: 'Basilic, pignons, parmesan', price: 12 },
    { id: 'grat-4f', cat: 'Pâtes gratinées', name: 'Gratin quatre fromages', desc: 'Penne, crème, fromages fondus', price: 14 },
    { id: 'grat-saumon', cat: 'Pâtes gratinées', name: 'Gratin saumon épinards', desc: 'Penne, saumon, épinards, crème', price: 15 },
    { id: 'focaccia', cat: 'Entrées chaudes', name: 'Focaccia romarin', desc: 'Sortie du four, fleur de sel', price: 4.5 },
    { id: 'arancini', cat: 'Entrées chaudes', name: 'Arancini (3)', desc: 'Riz, mozzarella, sauce tomate', price: 6 },
    { id: 'bruschetta', cat: 'Entrées chaudes', name: 'Bruschetta', desc: 'Pain grillé, tomates, basilic', price: 5.5 },
    { id: 'tiramisu', cat: 'Desserts', name: 'Tiramisu maison', desc: 'Mascarpone, café ristretto', price: 5.5 },
    { id: 'pannacotta', cat: 'Desserts', name: 'Panna cotta', desc: 'Coulis de fruits rouges', price: 5 },
    { id: 'limonata', cat: 'Boissons', name: 'Limonata sicilienne', desc: '33 cl, citron de Syracuse', price: 3.5 },
    { id: 'eau', cat: 'Boissons', name: 'Eau minérale', desc: '50 cl, plate ou pétillante', price: 2.5 },
    { id: 'soda', cat: 'Boissons', name: 'Sodas', desc: '33 cl, au choix', price: 3 },
    { id: 'biere', cat: 'Boissons', name: 'Bière italienne', desc: '33 cl', price: 5 },
    { id: 'chianti', cat: 'Boissons', name: 'Chianti', desc: 'Verre 25 cl', price: 6 },
    { id: 'cafe', cat: 'Boissons', name: 'Café ristretto', desc: 'Torréfaction italienne', price: 2 },
  ];

  const SIZES = [
    { id: 'solo', label: 'Solo', note: '26 cm · une faim', delta: 0 },
    { id: 'famille', label: 'Famille', note: '33 cm · à partager', delta: 4 },
  ];
  const DOUGHS = [
    { id: 'classique', label: 'Classique', delta: 0 },
    { id: 'fine', label: 'Fine', delta: 0 },
    { id: 'epaisse', label: 'Épaisse', delta: 1 },
  ];
  const BASES = [
    { id: 'tomate', label: 'Tomate' },
    { id: 'creme', label: 'Crème' },
    { id: 'blanche', label: "Blanche, huile d'ail" },
  ];
  const GROUPS = [
    { id: 'fromages', label: 'Fromages', note: 'au choix', items: [
      { id: 'fiordilatte', name: 'Fior di latte', price: 1.5 },
      { id: 'burrata', name: 'Burrata de Puglia', price: 3 },
      { id: 'gorgonzola', name: 'Gorgonzola', price: 2 },
      { id: 'parmesan', name: 'Parmesan 24 mois', price: 1.5 },
    ] },
    { id: 'charcuterie', label: 'Charcuterie', note: 'max 3', items: [
      { id: 'jambon', name: 'Jambon blanc', price: 2 },
      { id: 'speck', name: 'Speck fumé', price: 3 },
      { id: 'pepperoni', name: 'Pepperoni', price: 2.5 },
      { id: 'chorizo', name: 'Chorizo doux', price: 2 },
    ] },
    { id: 'legumes', label: 'Légumes', note: 'du marché', items: [
      { id: 'roquette', name: 'Roquette', price: 1 },
      { id: 'champignons', name: 'Champignons', price: 1.5 },
      { id: 'poivrons', name: 'Poivrons grillés', price: 1.5 },
      { id: 'olives', name: 'Olives taggiasche', price: 1.5 },
    ] },
    { id: 'finitions', label: 'Après cuisson', note: 'à la sortie du four', items: [
      { id: 'basilic', name: 'Basilic frais', price: 0.5 },
      { id: 'miel', name: 'Miel de châtaigne', price: 1 },
      { id: 'piquante', name: 'Huile piquante', price: 0.5 },
      { id: 'truffe', name: 'Crème de truffe', price: 3.5 },
    ] },
  ];
  const SLOTS = ['19:15', '19:30', '19:45'];
  const TIPS = [
    { id: 'none', label: 'Rien', v: 0 },
    { id: 'one', label: '1 €', v: 1 },
    { id: 'two', label: '2 €', v: 2 },
    { id: 'five', label: '5 €', v: 5 },
  ];
  const METHODS = [
    { id: 'applepay', label: 'Apple Pay', note: 'Face ID' },
    { id: 'card', label: 'Visa ·· 4417', note: 'enregistrée' },
    { id: 'counter', label: 'Au comptoir', note: 'à la remise' },
  ];
  const REWARDS = [
    { id: 'boisson', label: 'Boisson', cost: 100, icon: 'M6 4h12l-1.5 15a2 2 0 01-2 1.8h-5A2 2 0 017.5 19zM7 9h10' },
    { id: 'pizza', label: 'Pizza', cost: 300, icon: 'M12 3a9 9 0 019 9l-9 9-9-9a9 9 0 019-9M10 9h.01M14 12h.01' },
    { id: 'pates', label: 'Pâtes', cost: 350, icon: 'M4 5v6a8 8 0 0016 0V5M9 11v8M15 11v8' },
  ];
  const EVENTS = [
    { tag: 'Offre', title: '2 pizzas achetées, une offerte', body: 'Pour deux pizzas achetées, la troisième vous est offerte.' },
    { tag: 'Parrainage', title: 'Parrainez un proche', body: 'Le parrain et le filleul reçoivent chacun une boisson offerte.' },
  ];
  const HISTORY = [
    { name: 'Regina · Solo', date: 'Vendredi 19:20', price: 12.5 },
    { name: 'Portofino · Famille', date: 'Samedi dernier', price: 18 },
    { name: 'Diavola + tiramisu', date: 'Il y a deux semaines', price: 18.5 },
  ];
  const SETTINGS = [
    { label: 'Mes coordonnées', value: CONFIG.memberName },
    { label: 'Moyens de paiement', value: 'Visa ·· 4417' },
    { label: 'Notifications', value: 'Four prêt' },
    { label: 'Allergènes', value: 'Gluten' },
  ];

  /* ══════════════════════════════════════════════════════════════
     ÉTAT
     ══════════════════════════════════════════════════════════════ */
  const state = {
    screen: 'login',
    authed: false,
    cat: 'Pizzas',
    pizzaId: 'portofino',
    size: 'solo',
    dough: 'classique',
    base: 'tomate',
    extras: {},                 // { itemId: qty }
    lines: [{ id: 'l1', name: 'Regina', detail: 'Solo 26 cm · pâte fine · + champignons', qty: 1, unit: 14 }],
    slot: '19:30',
    method: 'applepay',
    tip: 1,
    spent: 0,
    claimed: null,
    modal: null,
    invited: false,
    trackMinutes: 14,
    bump: 0,
    flying: false,
  };

  /* ══════════════════════════════════════════════════════════════
     HELPERS
     ══════════════════════════════════════════════════════════════ */
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toFixed(2).replace('.', ',') + ' €';
  const byId = (arr, id) => arr.find((x) => x.id === id);
  const points = () => Math.max(0, CONFIG.loyalty.points - state.spent);

  function pill(active) {
    return active
      ? 'background:var(--gold-14);border-color:var(--gold-60);color:var(--gold)'
      : 'background:transparent;border-color:var(--line);color:var(--ink-dim)';
  }

  function icon(path, size, color) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"></path></svg>`;
  }

  function composed() {
    const p = byId(MENU, state.pizzaId) || MENU[2];
    const size = byId(SIZES, state.size) || SIZES[0];
    const dough = byId(DOUGHS, state.dough) || DOUGHS[0];
    const base = byId(BASES, state.base) || BASES[0];
    let total = p.price + size.delta + dough.delta;
    const names = [];
    GROUPS.forEach((g) => g.items.forEach((it) => {
      const q = state.extras[it.id] || 0;
      if (q) { total += it.price * q; names.push(q > 1 ? it.name + ' ×' + q : it.name); }
    }));
    const detail = size.label + ' ' + (size.id === 'solo' ? '26' : '33') + ' cm · pâte ' +
      dough.label.toLowerCase() + ' · ' + base.label.toLowerCase() +
      (names.length ? ' · + ' + names.join(', ') : '');
    return { p, total, detail };
  }

  function cartCount() { return state.lines.reduce((a, l) => a + l.qty, 0); }
  function subtotal() { return state.lines.reduce((a, l) => a + l.unit * l.qty, 0); }
  function discount() { return state.lines.length ? Math.min(3, subtotal() * 0.1) : 0; }
  function total() { return subtotal() - discount(); }

  let _qr = null;
  function qrCells() {
    if (_qr) return _qr;
    const N = 21, on = [];
    const fin = (r, c) => { const d = Math.max(Math.abs(r), Math.abs(c)); return d === 0 || d === 2; };
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let v;
      if (r < 7 && c < 7) v = fin(r - 3, c - 3);
      else if (r < 7 && c > N - 8) v = fin(r - 3, c - (N - 4));
      else if (r > N - 8 && c < 7) v = fin(r - (N - 4), c - 3);
      else if (r === 7 || c === 7) v = (r + c) % 2 === 0;
      else v = ((r * 7 + c * 13 + ((r * c) % 5)) % 3) !== 0;
      on.push(v);
    }
    _qr = on;
    return on;
  }

  /* ══════════════════════════════════════════════════════════════
     ACTIONS
     ══════════════════════════════════════════════════════════════ */
  function go(screen) { state.screen = screen; render(); window.scrollTo(0, 0); const a = $('app'); if (a) a.scrollTop = 0; }
  function pick(key, val) { state[key] = val; render(); }
  function openPizza(id) { state.pizzaId = id; state.extras = {}; state.screen = 'pizza'; render(); }

  function setExtra(id, d) {
    const q = Math.max(0, Math.min(3, (state.extras[id] || 0) + d));
    if (q === 0) delete state.extras[id]; else state.extras[id] = q;
    render();
  }

  function addLine(name, unit, detail) {
    state.lines.push({ id: 'l' + Date.now(), name, detail, qty: 1, unit });
    state.flying = true;
    state.bump += 1;
    render();
    setTimeout(() => { state.flying = false; render(); }, 740);
  }
  function addMenuItem(id) {
    const it = byId(MENU, id);
    addLine(it.name, it.price, it.cat === 'Pizzas' ? 'Solo 26 cm · recette de la maison' : 'À la carte');
  }
  function addComposed() { const c = composed(); addLine(c.p.name, c.total, c.detail); }

  function bumpQty(id, d) {
    state.lines = state.lines
      .map((l) => (l.id === id ? Object.assign({}, l, { qty: l.qty + d }) : l))
      .filter((l) => l.qty > 0);
    render();
  }

  function pay() { state.screen = 'track'; state.trackMinutes = 14; render(); }

  function openReward(id) { state.modal = id; render(); }
  function closeModal() { state.modal = null; render(); }
  function confirmClaim() {
    const r = byId(REWARDS, state.modal);
    if (r && points() >= r.cost) { state.spent += r.cost; state.claimed = r.label; }
    state.modal = null; render();

    const prenom = ($('reg-prenom') || {}).value?.trim() || '';

    const password = ($('reg-password') || {}).value || '';
    if (!prenom || !pseudo || !password) { showAuthError('Merci de remplir tous les champs.'); return; }

    // ... même traitement que doLogin (token + fillUserData)
    CONFIG.memberName = prenom;
    state.authed = true;

        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="eyebrow-gold">Commande #2148</div>
          <div style="font-family:var(--font-head);font-size:28px;line-height:1.1">${m > 8 ? 'Votre pizza est au four' : 'Bientôt au comptoir'}</div>
        </div>
        <div style="display:flex;justify-content:center;padding:6px 0">
          <div style="position:relative;width:210px;height:210px">
            <svg width="210" height="210" viewBox="0 0 210 210" style="display:block;transform:rotate(-90deg)">
              <circle cx="105" cy="105" r="92" fill="none" stroke="rgba(245,234,216,.09)" stroke-width="10"></circle>
              <circle cx="105" cy="105" r="92" fill="none" stroke="${GOLD}" stroke-width="10" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset 1.1s ease"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
              <div style="font-family:var(--font-head);font-size:42px;line-height:1">${m}</div>
              <div style="font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)">min restantes</div>
            </div>
          </div>
        </div>
        <div>${steps}</div>
        <div style="border-radius:22px;border:1px solid var(--gold-22);padding:18px;display:flex;align-items:center;gap:16px;background:var(--panel)">
          <div style="font-family:var(--font-head);font-size:30px;color:var(--gold);letter-spacing:.05em">4B7</div>
          <div style="font-size:12px;line-height:1.5;color:var(--ink-dim)">Donnez ce code au comptoir. On garde la pizza au chaud 10 minutes.</div>
        </div>
        <button class="ghost" style="height:48px;font-size:14px;border-color:rgba(245,234,216,.16);color:rgba(245,234,216,.7)" onclick="go('home')">Retour à l'accueil</button>
      </div>`;
  }

  function renderAccount() {
    const pts = points(), goal = CONFIG.loyalty.goal;
    const nextR = REWARDS.filter((r) => r.cost > pts)[0];
    const nextPct = nextR ? Math.round((pts / nextR.cost) * 100) : 100;
    const nextNote = nextR ? (nextR.cost - pts) + ' points avant votre ' + nextR.label.toLowerCase() + ' offerte.' : 'Toutes les récompenses sont débloquées.';
    const rewards = REWARDS.map((r) => { const ok = pts >= r.cost; return `
      <button style="flex:1;padding:15px 10px 13px;border-radius:18px;border:1px solid ${ok ? 'var(--gold-60)' : 'var(--line-2)'};background:${ok ? 'var(--gold-14)' : 'var(--surface)'};cursor:pointer;opacity:${ok ? 1 : .55};display:flex;flex-direction:column;align-items:center;gap:8px" onclick="openReward('${r.id}')">
        <span style="color:${ok ? GOLD : 'var(--ink-dim)'};display:flex">${icon(r.icon, 22)}</span>
        <span style="font-size:12.5px;color:${ok ? GOLD : 'var(--ink-dim)'}">${r.label}</span>
        <span style="font-size:11px;color:${ok ? 'rgba(216,176,106,.8)' : 'var(--ink-mute)'}">${r.cost} pts</span>
      </button>`; }).join('');
    const rewardNote = state.claimed ? state.claimed + ' récupérée — présentez votre code au comptoir.' : 'Appuyez sur une récompense pour la récupérer.';
    const history = HISTORY.map((h) => `
      <div style="display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:18px;background:var(--surface);border:1px solid var(--line-2)">
        <div style="flex:1;min-width:0"><div style="font-size:13.5px">${h.name}</div><div style="font-size:11.5px;color:var(--ink-faint)">${h.date}</div></div>
        <div style="font-size:13px;color:var(--gold)">${fmt(h.price)}</div>
        <button class="ghost" style="height:32px;padding:0 14px;font-family:var(--font-body);font-size:12px" onclick="go('cart')">Re-commander</button>
      </div>`).join('');

    let modalHtml = '';
    if (state.modal) {
      const r = byId(REWARDS, state.modal), ok = pts >= r.cost;
      modalHtml = `
        <div style="position:absolute;inset:0;z-index:40;background:rgba(8,6,5,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:96px 18px 18px" onclick="closeModal()">
          <div style="width:100%;border-radius:26px;padding:26px 22px 22px;background:linear-gradient(160deg,#231b13 0%,#100d0b 78%);border:1px solid var(--gold-35);box-shadow:0 22px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;gap:14px" onclick="event.stopPropagation()">
            <span style="width:54px;height:54px;border-radius:999px;border:1px solid var(--gold-42);background:var(--gold-12);display:flex;align-items:center;justify-content:center;color:var(--gold)">${icon(r.icon, 26)}</span>
            <div style="font-family:var(--font-head);font-size:23px;line-height:1.15;text-align:center">${ok ? r.label + ' offerte' : 'Encore ' + (r.cost - pts) + ' points'}</div>
            <div style="font-size:13px;line-height:1.55;text-align:center;color:var(--ink-dim)">${ok ? r.cost + ' points seront déduits de votre solde. Vous pourrez retirer votre ' + r.label.toLowerCase() + ' au comptoir.' : 'Cette récompense coûte ' + r.cost + ' points. Vous en avez ' + pts + '.'}</div>
            <div style="align-self:stretch;display:flex;flex-direction:column;gap:9px;margin-top:4px">
              ${ok ? `<button style="height:50px;border-radius:999px;border:none;background:var(--gold);color:#1a1208;font-family:var(--font-body);font-size:14.5px;font-weight:600;cursor:pointer" onclick="confirmClaim()">Confirmer et récupérer</button>` : ''}
              <button style="height:46px;border-radius:999px;border:1px solid rgba(245,234,216,.14);background:transparent;color:var(--ink-dim);font-size:13.5px;cursor:pointer" onclick="closeModal()">${ok ? 'Plus tard' : 'Fermer'}</button>
            </div>
          </div>
        </div>`;
    }

    return `
      <div class="screen" style="padding:calc(env(safe-area-inset-top, 0px) + 46px) 20px 26px;gap:22px;position:relative">
        <div class="h-display">Récompenses</div>
        <div style="border-radius:26px;padding:22px;background:linear-gradient(155deg,#1f1811 0%,#0c0a08 75%);border:1px solid var(--gold-35);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden">
          <div style="position:absolute;right:-38px;top:-38px;width:150px;height:150px;border-radius:999px;border:1px solid var(--gold-22)"></div>
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <div class="eyebrow">Mes points</div>
            <div style="font-size:11.5px;color:var(--ink-faint)">${CONFIG.memberName}</div>
          </div>
          <div style="display:flex;align-items:baseline;gap:8px">
            <div style="font-family:var(--font-head);font-size:38px;line-height:1;color:var(--gold)">${pts}</div>
            <div style="font-size:12.5px;color:var(--ink-faint)">points</div>
          </div>
          <div style="height:7px;border-radius:999px;background:rgba(245,234,216,.1);overflow:hidden"><div style="width:${nextPct}%;height:100%;border-radius:999px;background:linear-gradient(90deg,#a97c2f,#d8b06a)"></div></div>
          <div style="font-size:12.5px;line-height:1.5;color:var(--ink-dim)">${nextNote}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:11px">
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <div class="eyebrow">À échanger</div>
            <div style="font-size:11px;color:var(--ink-mute)">${pts} pts disponibles</div>
          </div>
          <div style="display:flex;gap:9px">${rewards}</div>
          <div style="font-size:11.5px;color:${state.claimed ? 'var(--olive)' : 'var(--ink-faint)'}">${rewardNote}</div>
        </div>

        <div style="display:flex;gap:10px">
          <div style="flex:1;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);padding:15px">
            <div style="font-family:var(--font-head);font-size:22px;color:var(--gold)">23</div>
            <div style="font-size:11.5px;color:var(--ink-faint)">commandes</div>
          </div>
          <div style="flex:1;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);padding:15px">
            <div style="font-family:var(--font-head);font-size:22px;color:var(--olive)">Regina</div>
            <div style="font-size:11.5px;color:var(--ink-faint)">votre habituelle</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:rgba(122,138,94,.1);border:1px solid rgba(143,160,115,.35)">
          <span style="width:42px;height:42px;flex:none;border-radius:999px;border:1px solid rgba(143,160,115,.45);display:flex;align-items:center;justify-content:center;color:var(--olive)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 00-4-4H6a4 4 0 00-4 4V20"></path><circle cx="9" cy="7" r="3.5"></circle><path d="M19 8v6M22 11h-6"></path></svg></span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="font-size:13.5px">Invitez un ami</div>
            <div style="font-size:11.5px;line-height:1.45;color:var(--ink-dim)">${state.invited ? 'Invitation envoyée — boisson offerte dès sa première commande.' : 'Une boisson offerte pour vous et pour lui.'}</div>
          </div>
          <button style="height:34px;padding:0 15px;flex:none;border-radius:999px;border:1px solid rgba(143,160,115,.5);background:transparent;color:var(--olive);font-size:12px;cursor:pointer" onclick="invite()">${state.invited ? 'Envoyée' : 'Inviter'}</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:11px">
          <div class="eyebrow">Dernières commandes</div>
          ${history}
        </div>
        ${modalHtml}
      </div>`;
  }

  function renderScan() {
    const cells = qrCells().map((v) => `<span style="background:${v ? '#201e1d' : '#f5ead8'}"></span>`).join('');
    const settings = SETTINGS.map((r) => `
      <div style="display:flex;align-items:center;padding:15px;background:var(--surface);border-bottom:1px solid var(--line-soft);font-size:13.5px">
        <span style="flex:1">${r.label}</span>
        <span style="font-size:12px;color:var(--ink-faint);margin-right:8px">${r.value}</span>
        <svg width="7" height="12" viewBox="0 0 8 14" fill="none" stroke="rgba(245,234,216,.3)" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"></path></svg>
      </div>`).join('');
    return `
      <div class="screen" style="padding:calc(env(safe-area-inset-top, 0px) + 46px) 20px 26px;gap:22px">
        <div class="h-display">Scanner</div>
        <div style="border-radius:26px;padding:24px 22px;background:linear-gradient(155deg,#1f1811 0%,#0c0a08 75%);border:1px solid var(--gold-35);display:flex;flex-direction:column;align-items:center;gap:17px">
          <div class="eyebrow-gold">Votre code personnel</div>
          <div style="padding:14px;border-radius:20px;background:#f5ead8">
            <div style="display:grid;grid-template-columns:repeat(21,7px);grid-auto-rows:7px">${cells}</div>
          </div>
          <div style="font-family:var(--font-head);font-size:19px;color:var(--gold);letter-spacing:.08em">${CONFIG.memberCode}</div>
          <div style="font-size:12px;line-height:1.5;text-align:center;color:var(--ink-dim)">Présentez ce code au comptoir pour cumuler vos points.</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:11px">
          <div class="eyebrow">Mon profil</div>
          <div style="display:flex;flex-direction:column;border-radius:18px;overflow:hidden;border:1px solid var(--line-2)">${settings}</div>
        </div>
        <button class="ghost" style="height:48px;font-family:var(--font-body);font-size:14px;border-color:rgba(245,234,216,.16);color:var(--ink-dim)" onclick="logout()">Se déconnecter</button>
      </div>`;
  }

  const eyeIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

  function renderLogin() {
    return `
      <div class="screen" style="padding:calc(env(safe-area-inset-top, 0px) + 60px) 24px 32px;gap:24px">
        <div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start">
          <div style="width:64px;height:64px;border-radius:999px;border:1px solid var(--gold-60);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--font-head);font-size:26px;background:var(--bg-deep)">P</div>
          <div>
            <div style="font-family:var(--font-head);font-size:32px;line-height:1.05">${CONFIG.name}</div>
            <div style="font-size:12.5px;color:var(--ink-faint);margin-top:2px">${CONFIG.tagline}</div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:var(--font-head);font-size:22px">Content de vous revoir</div>
          <div style="font-size:13px;color:var(--ink-dim)">Connectez-vous pour commander et cumuler vos points.</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="field">
            <label>Pseudo</label>
            <input id="login-pseudo" class="input" type="text" autocomplete="username" placeholder="votre pseudo">
          </div>
          <div class="field">
            <label>Mot de passe</label>
            <div class="input-wrap">
              <input id="login-password" class="input" type="password" autocomplete="current-password" placeholder="••••••••" style="padding-right:48px">
              <button class="eye" onclick="togglePw('login-password', this)">${eyeIcon}</button>
            </div>
          </div>
          <div id="auth-error" class="auth-error"></div>
          <div style="display:flex;justify-content:flex-end;margin-top:-4px">
            <button class="link-btn" onclick="return false">Mot de passe oublié ?</button>
          </div>
          <button class="cta" style="height:54px;margin-top:2px" onclick="doLogin()">Se connecter</button>
        </div>

        <div style="margin-top:auto;text-align:center;font-size:13.5px;color:var(--ink-dim);padding-top:8px">
          Pas encore de compte ? <button class="link-btn" onclick="go('register')">Créer un compte</button>
        </div>
      </div>`;
  }

  function renderRegister() {
    return `
      <div class="screen" style="padding:calc(env(safe-area-inset-top, 0px) + 52px) 24px 32px;gap:22px">
        <div style="display:flex;align-items:center;gap:12px">
          <button style="width:38px;height:38px;border-radius:999px;border:1px solid rgba(245,234,216,.16);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="go('login')">
            <svg width="10" height="17" viewBox="0 0 12 20" fill="none" stroke="#f5ead8" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"></path></svg>
          </button>
          <div style="width:38px;height:38px;border-radius:999px;border:1px solid var(--gold-60);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--font-head);font-size:17px;background:var(--bg-deep)">P</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:var(--font-head);font-size:26px">Créer votre compte</div>
          <div style="font-size:13px;color:var(--ink-dim)">Une pizza offerte vous attend à 300 points.</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="field"><label>Prénom</label><input id="reg-prenom" class="input" type="text" autocomplete="given-name" placeholder="Lucie"></div>
          <div class="field"><label>Pseudo</label><input id="reg-pseudo" class="input" type="text" autocomplete="username" placeholder="choisissez un pseudo"></div>
          <div class="field">
            <label>Mot de passe</label>
            <div class="input-wrap">
              <input id="reg-password" class="input" type="password" autocomplete="new-password" placeholder="6 caractères minimum" style="padding-right:48px">
              <button class="eye" onclick="togglePw('reg-password', this)">${eyeIcon}</button>
            </div>
          </div>
          <div id="auth-error" class="auth-error"></div>
          <button class="cta" style="height:54px;margin-top:2px" onclick="doRegister()">Créer mon compte</button>
        </div>

        <div style="margin-top:auto;text-align:center;font-size:13.5px;color:var(--ink-dim);padding-top:8px">
          Déjà un compte ? <button class="link-btn" onclick="go('login')">Se connecter</button>
        </div>
      </div>`;
  }

  function renderTabs() {
    const showTabs = ['home', 'menu', 'cart', 'account', 'scan'].indexOf(state.screen) > -1;
    if (!showTabs) return '';
    const col = (s) => state.screen === s ? GOLD : 'var(--ink-faint)';
    const tab = (s, label, path) => `
      <button class="tab ${state.screen === s ? 'on' : ''}" onclick="go('${s}')">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">${path}</svg>
        ${label}
      </button>`;
    return `
      <div class="tabs">
        ${tab('home', 'Accueil', '<path d="M3 10.5L12 3l9 7.5"></path><path d="M5 10v10h14V10"></path>')}
        ${tab('account', 'Récompenses', '<path d="M12 3.5l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.8-5 2.8 1-5.6-4-3.9 5.5-.8z"></path>')}
        <button class="tab-center" onclick="go('menu')">
          <span class="knob" style="color:${state.screen === 'menu' ? '#a97c2f' : '#201e1d'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13a3 3 0 013 3v13H7a3 3 0 01-3-3z"></path><path d="M8 8h8"></path><path d="M8 12h6"></path></svg>
            <span style="font-size:11px;font-weight:700">Carte</span>
          </span>
        </button>
        <button class="tab ${state.screen === 'cart' ? 'on' : ''}" onclick="go('cart')">
          <span style="position:relative;display:block">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.2 12a2 2 0 01-2 1.8H8.2a2 2 0 01-2-1.8z"></path><path d="M9 7a3 3 0 016 0"></path></svg>
            ${cartCount() ? `<span class="badge" style="${state.bump ? 'animation:pf-pop .42s ease' : ''}">${cartCount()}</span>` : ''}
          </span>
          Panier
        </button>
        ${tab('scan', 'Scanner', '<path d="M4 9V6a2 2 0 012-2h3"></path><path d="M15 4h3a2 2 0 012 2v3"></path><path d="M20 15v3a2 2 0 01-2 2h-3"></path><path d="M9 20H6a2 2 0 01-2-2v-3"></path><path d="M8 12h8"></path>')}
      </div>`;
  }

  /* ══════════════════════════════════════════════════════════════
     RENDER (aiguillage — même logique que l'appli de base)
     ══════════════════════════════════════════════════════════════ */
  function render() {
    // Garde-fou : sans session, on reste sur connexion / inscription
    if (!state.authed && state.screen !== 'login' && state.screen !== 'register') state.screen = 'login';
    const screens = {
      login: renderLogin, register: renderRegister,
      home: renderHome, menu: renderMenu, pizza: renderPizza, cart: renderCart,
      pay: renderPay, track: renderTrack, account: renderAccount, scan: renderScan,
    };
    const body = (screens[state.screen] || renderHome)();
    const fly = state.flying ? '<div class="fly-dot"></div>' : '';
    $('app').innerHTML = body + renderTabs() + fly;
  }

  /* Suivi de commande : décrémente le minuteur (temps réel simulé) */
  setInterval(() => {
    if (state.screen === 'track' && state.trackMinutes > 1) { state.trackMinutes -= 1; render(); }
  }, 4000);

  render();
  </script>
</body>
</html>
